<svg xmlns="http://www.w3.org/2000/svg" width="760" height="70" viewBox="0 0 760 70">
<defs>
<linearGradient id="sh" x1="-1" x2="0" y1="0" y2="0">
<stop offset="0" stop-color="#e6edf3"/><stop offset=".45" stop-color="#e6edf3"/>
<stop offset=".5" stop-color="#39d353"/><stop offset=".55" stop-color="#e6edf3"/><stop offset="1" stop-color="#e6edf3"/>
<animate attributeName="x1" values="-1;1" dur="3s" repeatCount="indefinite"/>
<animate attributeName="x2" values="0;2" dur="3s" repeatCount="indefinite"/>
</linearGradient>
<style>
.hand{transform-origin:70% 80%;transform-box:fill-box;animation:wave 2.2s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:36px;font-weight:700}
</style>
</defs>
<text x="175" y="48" class="t" fill="url(#sh)">Hi</text>
<text x="225" y="48" class="t hand">👋</text>
<text x="272" y="48" class="t" fill="url(#sh)">, I'm Shishir Singh</text>
</svg>